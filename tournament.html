<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tournament Tracker</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <h1>Team Tournament Tracker</h1>
    
    <div class="bracket">
        <div class="round round-1">
            <div class="match" id="match1">
                <div class="team" onclick="selectWinner('match1', 'team1')">Team A</div>
                <div class="team" onclick="selectWinner('match1', 'team2')">Team B</div>
            </div>
            <div class="match" id="match2">
                <div class="team" onclick="selectWinner('match2', 'team3')">Team C</div>
                <div class="team" onclick="selectWinner('match2', 'team4')">Team D</div>
            </div>
        </div>
        <div class="round round-2">
            <div class="match" id="final">
                <div class="team" id="finalist1">Winner of Match 1</div>
                <div class="team" id="finalist2">Winner of Match 2</div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
