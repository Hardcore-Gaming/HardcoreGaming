<!DOCTYPE html>
<html lang="en">
<head>
    <style>
        body {
    font-family: Arial, sans-serif;
    text-align: center;
}

.bracket {
    display: flex;
    justify-content: center;
    gap: 50px;
}

.round {
    display: flex;
    flex-direction: column;
    gap: 20px;
}

.match {
    border: 1px solid #333;
    padding: 10px;
    border-radius: 5px;
    width: 150px;
}

.team {
    padding: 5px;
    cursor: pointer;
}

.team.winner {
    background-color: #4CAF50;
    color: white;
}
    </style>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tournament </title>
</head>
<body>
    <h1>Team Tournament Tracker</h1>
    
    <div class="bracket">
        <div class="round round-1">
            <div class="match" id="match1">
                <div class="team" onclick="selectWinner('match1', 'team1')">Team A</div>
                <div class="team" onclick="selectWinner('match1', 'team2')">Team B</div>
            </div>
            <div class="match" id="match2">
                <div class="team" onclick="selectWinner('match2', 'team3')">Team C</div>
                <div class="team" onclick="selectWinner('match2', 'team4')">Team D</div>
            </div>
        </div>
        <div class="round round-2">
            <div class="match" id="final">
                <div class="team" id="finalist1">Winner of Match 1</div>
                <div class="team" id="finalist2">Winner of Match 2</div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
